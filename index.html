<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dev Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
    <script src="./search.js"></script>
</head>
<body>

<header>
<nav class="bancol px-5 navbar navbar-expand navbar-dark position-fixed w-100 top-0"
     style="z-index: 1030;">
    <a class="navbar-brand" href="#" onclick="loadDefaultPage()">Dev Log</a>

    <ul class="navbar-nav ms-auto flex-row align-items-center gap-3">
        <li class="nav-item">
            <a class="nav-link" href="#" onclick="loadDefaultPage()">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link d-flex align-items-center"
               href="https://github.com/CokeWithExtraIce"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="GitHub Profile"
               title="GitHub Profile">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="22"
                     height="22"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     aria-hidden="true">
                    <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.8 2.29 3.29 1.73.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.27-2.6 5.21-5.08 5.49.4.35.75 1.02.75 2.06v3.06c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/>
                </svg>
            </a>
        </li>


    </ul>
</nav>
</header>

<div class="main-layout" id="main-layout">
    <main id="content-container">
        <article id="content"></article>
    </main>

    <aside id="sidebar">
        <div id="sidebar-content">
            <h5 class="mb-3 text-secondary">Search</h5>
            <div id="search-box-container"></div>
            <div id="tree-menu">Loading list...</div>
        </div>
    </aside>

    <button class="btn btn-sm btn-outline-secondary" id="sidebar-toggle-btn" onclick="toggleVisibility()">
        ◀ 
    </button>
</div>

<footer class="bancol text-white p-3 text-center" onclick="window.scrollTo({top: 0, behavior: 'instant'});">
    Back to Top
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

<script>
    let docsTree = {};

    marked.setOptions({
        gfm: true,
        breaks: true
    });

    const renderer = new marked.Renderer();
    renderer.table = function(token) {
        let headerHtml = '';
        let bodyHtml = '';

        if (token.header) {
            headerHtml = '<tr>' + token.header.map(cell => `<th>${marked.parseInline(cell.text)}</th>`).join('') + '</tr>';
        }

        if (token.rows) {
            bodyHtml = token.rows.map(row => {
                const rowContent = row.map(cell => `<td>${marked.parseInline(cell.text)}</td>`).join('');
                return `<tr>${rowContent}</tr>`;
            }).join('');
        }

        return `<div class="table-responsive my-3">
            <table class="table table-striped table-bordered table-hover">
                <thead>${headerHtml}</thead>
                <tbody>${bodyHtml}</tbody>
            </table>
        </div>`;
    };

    marked.use({ renderer });

    function toggleVisibility() {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle-btn');
        
        sidebar.classList.toggle('collapsed');
        
        if (sidebar.classList.contains('collapsed')) {
            toggleBtn.innerText = '◀';
        } else {
            toggleBtn.innerText = '▶';
        }
    }

    async function loadDocsConfig() {
        const menuContainer = document.getElementById('tree-menu');
        try {
            const response = await fetch('./docs-config.json');
            if (!response.ok) throw new Error('Failed to load docs-config.json file.');
            docsTree = await response.json();
            
            renderSidebar();
            if (typeof initSearch === 'function') initSearch();
        } catch (err) {
            menuContainer.innerHTML = `<p class="text-danger">${err.message}</p>`;
        }
    }

    function renderSidebar() {
        const menuContainer = document.getElementById('tree-menu');
        menuContainer.innerHTML = '';

        if (!docsTree || Object.keys(docsTree).length === 0) {
            menuContainer.innerHTML = '<p class="text-muted">Document list is empty.</p>';
            return;
        }

        Object.entries(docsTree).forEach(([categoryName, fileNames]) => {
            const categoryEl = document.createElement('div');
            categoryEl.className = 'category open';

            const titleEl = document.createElement('div');
            titleEl.className = 'category-title';
            titleEl.innerText = categoryName;
            titleEl.onclick = () => categoryEl.classList.toggle('open');

            const fileListEl = document.createElement('ul');
            fileListEl.className = 'file-list';

            fileNames.forEach(fileName => {
                const filePath = `docs/${categoryName}/${fileName}.md`;

                const fileEl = document.createElement('li');
                fileEl.className = 'file-item';
                fileEl.innerText = fileName;
                fileEl.setAttribute('data-path', filePath);
                fileEl.onclick = (e) => {
                    e.stopPropagation();
                    loadMarkdown(filePath, fileEl);
                };
                fileListEl.appendChild(fileEl);
            });

            categoryEl.appendChild(titleEl);
            categoryEl.appendChild(fileListEl);
            menuContainer.appendChild(categoryEl);
        });
    }

    async function loadMarkdown(filePath, element) {
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error('Failed to load file. Please check the path.');
            const markdownText = await response.text();

            document.getElementById('content').innerHTML = marked.parse(markdownText);
            hljs.highlightAll();
        } catch (err) {
            document.getElementById('content').innerHTML = `<h2>Error</h2><p>${err.message}</p>`;
        }
    }

    async function loadDefaultPage() {
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        try {
            const response = await fetch('./home.html');
            if (!response.ok) throw new Error('Failed to load home.html file.');
            const htmlText = await response.text();
            document.getElementById('content').innerHTML = htmlText;
        } catch (err) {
            document.getElementById('content').innerHTML = `<h2>Error</h2><p>${err.message}</p>`;
        }
    }

    window.onload = () => {
        loadDocsConfig();
        loadDefaultPage();
    };
</script>
</body>
</html>
